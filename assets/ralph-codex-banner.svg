<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" rx="12" fill="url(#bg)"/>
  <rect x="0" y="148" width="600" height="12" rx="0 0 12 12" fill="url(#accent)" opacity="0.3"/>
  <!-- Loop icon -->
  <g transform="translate(40, 50)">
    <circle cx="30" cy="30" r="24" stroke="url(#accent)" stroke-width="3" fill="none" stroke-dasharray="8 4"/>
    <path d="M42 18 L48 24 L42 30" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 42 L12 36 L18 30" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Title -->
  <text x="110" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" letter-spacing="-1">ralph-codex</text>
  <!-- Subtitle -->
  <text x="110" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Iterative AI dev loops with PRD tracking &amp; multi-agent orchestration</text>
  <!-- Tags -->
  <g transform="translate(110, 115)">
    <rect x="0" y="0" width="70" height="22" rx="11" fill="#60a5fa" opacity="0.15"/>
    <text x="35" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Codex CLI</text>
    <rect x="78" y="0" width="82" height="22" rx="11" fill="#a78bfa" opacity="0.15"/>
    <text x="119" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Claude Code</text>
    <rect x="168" y="0" width="60" height="22" rx="11" fill="#34d399" opacity="0.15"/>
    <text x="198" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Node.js</text>
    <rect x="236" y="0" width="90" height="22" rx="11" fill="#fbbf24" opacity="0.15"/>
    <text x="281" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Cross-platform</text>
  </g>
</svg>
